---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ivuorinen/github-app-actions-runner:test

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ivuorinen/github-app-actions-runner:test
          format: sarif
          output: trivy-results.sarif
          # Build artifacts often have HIGH CVEs against transitive
          # dependencies that are out of our control until the base image
          # rebases. Don't fail PRs on those, but do upload them to the
          # Security tab so they're visible.
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Vendored dependencies inside base-image components are excluded:
          # Trivy's "fixed version" for a Go/npm module vendored into an
          # upstream binary refers to the module, not to any released binary,
          # so ignore-unfixed cannot suppress them and no action in this repo
          # can remediate them (only an actions/runner or docker/buildx
          # release revendoring the fix can). OS packages and our own layers
          # remain fully scanned. Rationale in docs/SECURITY.md.
          skip-files: /usr/local/lib/docker/cli-plugins/docker-buildx
          skip-dirs: /home/runner/externals/node20/lib/node_modules/npm/node_modules,/home/runner/externals/node24/lib/node_modules/npm/node_modules

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      - name: Smoke test — entrypoint refuses non-root PEM (owner check)
        # No untrusted github.event.* values are used in this step; the
        # entire body is repository-controlled. The PEM is a throwaway
        # generated inside the step and never reaches GitHub.
        # Phase 1: PEM is owned by the GHA runner user (uid != 0) so the
        # entrypoint's owner check fires first.
        env:
          IMAGE_TAG: ivuorinen/github-app-actions-runner:test
        run: |
          set -Eeuo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          openssl genrsa -out "$tmpdir/key.pem" 2048 >/dev/null 2>&1
          chmod 600 "$tmpdir/key.pem"
          set +e
          docker run --rm \
            -v "$tmpdir/key.pem:/run/secrets/github_app_key:ro" \
            -e GITHUB_APP_ID=1 \
            -e GITHUB_APP_INSTALLATION_ID=1 \
            -e GITHUB_APP_PRIVATE_KEY_FILE=/run/secrets/github_app_key \
            -e RUNNER_SCOPE=org \
            -e GITHUB_ORG=test \
            -e RUNNER_WORKDIR=/home/runner/_work \
            "$IMAGE_TAG" 2>&1 | tee out-owner.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "FAIL: entrypoint exited 0 with non-root-owned PEM"
            exit 1
          fi
          if ! grep -qE "Key file must be owned by UID 0" out-owner.log; then
            echo "FAIL: entrypoint did not produce the expected owner error"
            cat out-owner.log
            exit 1
          fi
          echo "PASS: entrypoint correctly rejected non-root-owned PEM"

      - name: Smoke test — entrypoint refuses mode 644 PEM (N-1 regression)
        # Phase 2: PEM is chowned to UID 0 so the owner check passes; the
        # subsequent mode check is the operator-precedence-sensitive line
        # that broke under N-1. Without sudo chown, Phase 1 masks this path.
        # No untrusted github.event.* values are used.
        env:
          IMAGE_TAG: ivuorinen/github-app-actions-runner:test
        run: |
          set -Eeuo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          openssl genrsa -out "$tmpdir/key.pem" 2048 >/dev/null 2>&1
          sudo chown 0:0 "$tmpdir/key.pem"
          sudo chmod 644 "$tmpdir/key.pem"
          set +e
          docker run --rm \
            -v "$tmpdir/key.pem:/run/secrets/github_app_key:ro" \
            -e GITHUB_APP_ID=1 \
            -e GITHUB_APP_INSTALLATION_ID=1 \
            -e GITHUB_APP_PRIVATE_KEY_FILE=/run/secrets/github_app_key \
            -e RUNNER_SCOPE=org \
            -e GITHUB_ORG=test \
            -e RUNNER_WORKDIR=/home/runner/_work \
            "$IMAGE_TAG" 2>&1 | tee out-mode.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "FAIL: entrypoint exited 0 with mode 644 PEM — N-1 may have regressed"
            exit 1
          fi
          if ! grep -qE "Key file permissions must not grant any access" out-mode.log; then
            echo "FAIL: entrypoint did not produce the expected mode error"
            cat out-mode.log
            exit 1
          fi
          echo "PASS: entrypoint correctly rejected mode 644 PEM (N-1 regression guarded)"
