---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Verify entrypoint arithmetic precedence
        # Regression guard for the bash arithmetic operator-precedence bug
        # (see .claude/rules/09-arithmetic-precedence-bash.md). Shared
        # source of truth with the pre-commit local hook.
        # No untrusted github.event.* references in this step.
        run: scripts/pre-commit-hooks/check-arithmetic-precedence.sh scripts/entrypoint.sh scripts/healthcheck.sh .claude/hooks/*.sh scripts/pre-commit-hooks/*.sh

      - name: Verify no socket mount in runner services
        # Regression guard for .claude/rules/04-docker-socket-never-in-runner.md.
        # Calls the same script the pre-commit local hook uses, so a single
        # source of truth detects the violation client-side and in CI.
        # No untrusted github.event.* references in this step.
        run: scripts/pre-commit-hooks/check-no-docker-sock-in-runner.sh docker-compose.yml

      - name: Verify all hooks are executable
        # Catches missing chmod +x on .claude/hooks/*.sh, which silently
        # disables the hook in PreToolUse.
        run: |
          set -Eeuo pipefail
          non_exec=$(find .claude/hooks -name '*.sh' -not -perm -u+x -print)
          if [[ -n "${non_exec}" ]]; then
            echo "FAIL: hook scripts missing execute bit:"
            echo "${non_exec}"
            exit 1
          fi
          echo "PASS: all .claude/hooks/*.sh are executable"

      - name: Verify hooks block and allow correctly
        # Behavioral test: feeds canonical stdin-JSON payloads to each hook and
        # asserts block (exit 2) / allow (exit 0). An executable-bit check is
        # not enough — it cannot catch a hook that reads the wrong input source
        # and silently allows everything (the N-61 regression class).
        run: scripts/pre-commit-hooks/test-hooks.sh

      - name: Verify security invariants (rules 06/11/12/13)
        # Enforces digest-pinning, socket-proxy surface, runner caps, and
        # no-broad-COPY on the committed files — independent of the client-side
        # Claude hooks, so direct edits by any contributor are also caught.
        run: scripts/pre-commit-hooks/check-security-invariants.sh Dockerfile docker-compose.yml
