---
name: github-actions-runners

x-runner-common: &runner-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${RUNNER_IMAGE_NAME:-local/github-app-actions-runner:latest}
  restart: unless-stopped
  # Wait for socket-proxy to be healthy before starting the runner. Without
  # this, the first workflow that calls `docker pull` would fail until the
  # proxy listener is ready. service_healthy uses the proxy's healthcheck.
  depends_on:
    socket-proxy:
      condition: service_healthy
  env_file:
    - path: .env
      required: false
  # The GitHub App PEM is mounted read-only from the host path set in
  # GITHUB_APP_PRIVATE_KEY_HOST_PATH and appears inside the container at
  # /run/secrets/github_app_key (matched by GITHUB_APP_PRIVATE_KEY_FILE).
  volumes:
    - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:?GITHUB_APP_PRIVATE_KEY_HOST_PATH must be set to the absolute host path of the GitHub App PEM file}:/run/secrets/github_app_key:ro
  # Runners reach the Docker daemon through socket-proxy (same Compose
  # project network) — they do not mount the host socket directly.
  # DOCKER_HOST is set per-service in each runner's environment block.
  tmpfs:
    - /tmp:size=1g,exec
    - /runner-tmp:size=128m,noexec,mode=0700,uid=${RUNNER_UID:-1001}
  security_opt:
    - no-new-privileges:true
  # Drop all Linux capabilities and re-add only the minimum needed:
  #   SETGID/SETUID   — gosu drop-privs from root entrypoint to runner user
  #   CHOWN/FOWNER    — actions-runner extracts tarballs with various owners
  #   DAC_OVERRIDE    — some upstream setup-* actions assume this is present
  #   KILL            — runner manages child worker processes
  # Everything else (NET_RAW, NET_BIND_SERVICE, SYS_CHROOT, MKNOD,
  # AUDIT_WRITE, SETFCAP, SETPCAP, FSETID) is dropped for defense in depth.
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    - KILL
  # Resource limits prevent a single runaway workflow from DoS-ing the host
  # and its sibling runners. Tune to host capacity.
  mem_limit: ${RUNNER_MEM_LIMIT:-4g}
  cpus: ${RUNNER_CPUS:-2}
  pids_limit: ${RUNNER_PIDS_LIMIT:-1024}
  ulimits:
    nofile:
      soft: ${RUNNER_NOFILE_SOFT:-4096}
      hard: ${RUNNER_NOFILE_HARD:-8192}
  # Stop signal and longer grace period so the runner has time to finish the
  # current job and deregister via the EXIT trap before the container is
  # killed. Default 10s is not enough for a long-running job to checkpoint.
  stop_signal: SIGTERM
  stop_grace_period: ${RUNNER_STOP_GRACE:-2m}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  runner-1:
    <<: *runner-common
    hostname: ${RUNNER_CONTAINER_PREFIX:-gha-runner}-1
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_key
      GITHUB_HOST: ${GITHUB_HOST:-github.com}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_WEB_URL: ${GITHUB_WEB_URL:-https://github.com}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      GITHUB_ORG: ${GITHUB_ORG:-}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-/home/runner/_work}
      UNSET_CONFIG_VARS: ${UNSET_CONFIG_VARS:-true}
      RUNNER_INSTANCE_NAME: ${RUNNER_1_NAME:-}
      RUNNER_DEFAULT_LABELS: ${RUNNER_DEFAULT_LABELS:-self-hosted,linux,x64,docker,ephemeral}
      RUNNER_EXTRA_LABELS: ${RUNNER_1_LABELS:-lint,small}

  runner-2:
    <<: *runner-common
    hostname: ${RUNNER_CONTAINER_PREFIX:-gha-runner}-2
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_key
      GITHUB_HOST: ${GITHUB_HOST:-github.com}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_WEB_URL: ${GITHUB_WEB_URL:-https://github.com}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      GITHUB_ORG: ${GITHUB_ORG:-}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-/home/runner/_work}
      UNSET_CONFIG_VARS: ${UNSET_CONFIG_VARS:-true}
      RUNNER_INSTANCE_NAME: ${RUNNER_2_NAME:-}
      RUNNER_DEFAULT_LABELS: ${RUNNER_DEFAULT_LABELS:-self-hosted,linux,x64,docker,ephemeral}
      RUNNER_EXTRA_LABELS: ${RUNNER_2_LABELS:-lint,medium}

  runner-3:
    <<: *runner-common
    hostname: ${RUNNER_CONTAINER_PREFIX:-gha-runner}-3
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_key
      GITHUB_HOST: ${GITHUB_HOST:-github.com}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_WEB_URL: ${GITHUB_WEB_URL:-https://github.com}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      GITHUB_ORG: ${GITHUB_ORG:-}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-/home/runner/_work}
      UNSET_CONFIG_VARS: ${UNSET_CONFIG_VARS:-true}
      RUNNER_INSTANCE_NAME: ${RUNNER_3_NAME:-}
      RUNNER_DEFAULT_LABELS: ${RUNNER_DEFAULT_LABELS:-self-hosted,linux,x64,docker,ephemeral}
      RUNNER_EXTRA_LABELS: ${RUNNER_3_LABELS:-general}

  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    restart: unless-stopped
    # Read-only root filesystem with explicit tmpfs for haproxy's runtime
    # state (sockets, pid file). Defense-in-depth: if a workflow ever
    # finds a way to write through the proxy, it cannot persist a payload.
    read_only: true
    tmpfs:
      - /run:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    # Socket-proxy is the single mediator for all Docker API access from
    # runner containers — dropping every capability limits the blast radius
    # if the proxy process is ever compromised. haproxy (the proxy binary)
    # listens on a high TCP port and does not need any Linux capabilities.
    cap_drop:
      - ALL
    # Bound resources so a misbehaving job spamming the proxy cannot DoS
    # other runners by exhausting the proxy.
    mem_limit: ${PROXY_MEM_LIMIT:-128m}
    pids_limit: ${PROXY_PIDS_LIMIT:-64}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    # End-to-end readiness probe: GET /_ping through the proxy. A 200 OK
    # means (a) haproxy has bound the TCP listener and (b) the upstream
    # docker.sock is reachable. A plain `nc -z 127.0.0.1 2375` would mark
    # the proxy healthy as soon as haproxy bound — even when the host
    # socket is missing or unmounted (Coolify misconfiguration), which
    # would then surface as opaque "Cannot connect to the Docker daemon"
    # errors inside workflows. wget is available in the upstream Alpine
    # image; `PING: 1` (below) is what permits this request through the
    # method/path allowlist.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2375/_ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      # Allowed: image pull/build operations only.
      # CONTAINERS is intentionally omitted: enabling it allows workflow jobs to
      # call GET /containers/{id}/json on sibling runners and read their
      # environment variables, and POST /containers/{id}/exec to run arbitrary
      # commands inside a sibling runner container.
      # If workflow jobs require `docker run`, add CONTAINERS: 1 and document
      # the cross-runner inspection risk in your security model.
      IMAGES: 1
      BUILD: 1
      POST: 1
      INFO: 1
      PING: 1
      # Keep the haproxy log level low — every Docker API call from a runner
      # job would otherwise print a line, flooding container logs.
      LOG_LEVEL: warning

# To add another runner, copy one of the runner-* services and change:
# - service name
# - hostname
# - RUNNER_INSTANCE_NAME variable
# - RUNNER_EXTRA_LABELS variable (per-runner labels; combined with RUNNER_DEFAULT_LABELS
#   by entrypoint.sh to form the final label set passed to config.sh)
