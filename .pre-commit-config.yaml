---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.json, --fix]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=style"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # `-shellcheck=` disables actionlint's bundled shellcheck-via-actionlint
        # pass. The shellcheck pre-commit hook above already covers shell
        # content; disabling here avoids requiring shellcheck on PATH inside
        # the actionlint pre-commit environment (which it does not provide).
        # actionlint's other checks (workflow syntax, action references,
        # injection-flagged `${{ github.event.* }}` in `run:` blocks) remain
        # active.
        args: ["-shellcheck="]

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: "3.3.8"
    hooks:
      - id: checkov
        args:
          - "--quiet"

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        args:
          - "--failure-threshold"
          - "warning"

  # Local hooks for invariants that no upstream catches. The actual
  # logic lives in scripts/pre-commit-hooks/ so that the YAML stays
  # readable and each hook can be invoked stand-alone for debugging.
  - repo: local
    hooks:
      - id: arithmetic-precedence-trap
        name: bash arithmetic precedence trap
        entry: scripts/pre-commit-hooks/check-arithmetic-precedence.sh
        language: script
        files: \.sh$
      - id: no-docker-sock-in-runner
        name: docker.sock only in socket-proxy
        entry: scripts/pre-commit-hooks/check-no-docker-sock-in-runner.sh
        language: script
        files: (docker-compose|compose)\.ya?ml$
      - id: security-invariants
        name: digest-pin / socket-proxy / caps / no-broad-copy invariants
        entry: scripts/pre-commit-hooks/check-security-invariants.sh
        language: script
        files: (Dockerfile|(docker-compose|compose)\.ya?ml)$
      - id: hook-behavior-test
        name: .claude/hooks block/allow behavior test
        entry: scripts/pre-commit-hooks/test-hooks.sh
        language: script
        files: ^\.claude/hooks/.*\.sh$
        pass_filenames: false
